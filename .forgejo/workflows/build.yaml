on: [push]
jobs:
  build:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ">=1.26"
          cache: false
      # - run: go generate ./...
      - run: go build .
      - uses: actions/upload-artifact@v3
        with:
          name: binary
          path: immich-sync
